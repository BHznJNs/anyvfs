version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"

  - package-ecosystem: gomod
    directory: "/native"
    schedule:
      interval: daily
      time: "13:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: "ci"
