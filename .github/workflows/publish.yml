name: Publish Python distribution to PyPI

on: push

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build source distribution
        run: uv build --sdist --no-sources
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/
          if-no-files-found: error

  build-wheels:
    name: Build wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: runner.os == 'Windows'
        with:
          go-version: "1.27.4"
          cache-dependency-path: native/go.sum
      - name: Build wheels with bundled Go bridge
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Store wheel packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vfspy
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          merge-multiple: true
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
