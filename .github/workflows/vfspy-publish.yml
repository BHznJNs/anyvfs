name: Publish vfspy to PyPI

on: push

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vfspy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: packages/vfspy/.python-version
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Install RPC generation dependencies
        run: uv sync --locked --only-group dev --no-install-project
      - name: Generate RPC bindings
        run: uv run --no-sync python scripts/generate_proto.py
      - name: Build source distribution
        run: uv build --sdist --no-sources
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: packages/vfspy/dist/
          if-no-files-found: error

  build-wheels:
    name: Build wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/vfspy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version-file: packages/vfspy/.python-version
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install RPC generation dependencies
        run: uv sync --locked --only-group dev --no-install-project
      - name: Generate RPC bindings
        run: uv run --no-sync python scripts/generate_proto.py
      - name: Build wheels with bundled Go bridge
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: packages/vfspy
          output-dir: packages/vfspy/dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Store wheel packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheels-${{ matrix.os }}
          path: packages/vfspy/dist/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vfspy
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          merge-multiple: true
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
