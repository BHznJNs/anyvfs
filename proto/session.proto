syntax = "proto3";
package anyvfs;
option go_package = "anyvfs/native/internal/rpc;rpc";

import "events.proto";

message Ready {}
message Stopped {}
message Stop {}
message Command { oneof value { Stop stop = 1; } }
message Notice {
  oneof value { Ready ready = 1; Event event = 2; Stopped stopped = 3; }
}
