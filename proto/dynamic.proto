syntax = "proto3";
package anyvfs;
option go_package = "anyvfs/native/internal/rpc;rpc";

// Use the absolute path within the mount, with names from bootstrap and directory listings.
// Callback failures are reported as non-OK gRPC statuses for the individual call.
message DynamicPathRequest { string path = 1; }

message DynamicChild {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_FILE = 1;
    KIND_DIRECTORY = 2;
  }

  // A single relative path component under the directory being listed.
  string name = 1;
  // Must be KIND_FILE or KIND_DIRECTORY.
  Kind kind = 2;
}

// A complete snapshot of direct children. An empty list represents an empty directory.
// Validate the entire list before using it, including name uniqueness under the mount's case rules.
message DynamicDirectoryListing { repeated DynamicChild children = 1; }

// The complete content snapshot for one open handle, requested on its first read.
// Empty bytes represent an empty file.
message DynamicFileContent { bytes data = 1; }
