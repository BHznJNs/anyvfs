[project]
name = "vfspy"
version = "0.1.0"
description = "Generated gRPC bindings for the vfspy native filesystem bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.78,<2", "protobuf>=6.31.1,<7"]

[dependency-groups]
dev = ["grpcio-tools==1.78.0", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vfspy"]

[tool.hatch.build.targets.sdist]
include = ["src", "native", "proto", "scripts", "examples", "tests", "README.md", "docs", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/vfspy/_rpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
