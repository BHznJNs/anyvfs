[project]
name = "vfspy"
version = "0.1.0"
description = "Python client package for the AnyVFS native filesystem bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.78,<2", "protobuf>=6.31.1,<7", "pydantic>=2.10,<3"]

[project.entry-points.pyinstaller40]
hook-dirs = "vfspy.__pyinstaller:get_hook_dirs"

[dependency-groups]
dev = ["grpcio-tools==1.78.0", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vfspy"]
artifacts = ["src/vfspy/_rpc"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "native",
    "proto",
    "scripts",
    "examples",
    "tests",
    "README.md",
    "docs",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
]
artifacts = ["src/vfspy/_rpc", "native/internal/rpc"]

[tool.cibuildwheel]
# The bridge does not use the Python ABI: one py3-none wheel per platform suffices.
build = ["cp311-manylinux_x86_64", "cp311-win_amd64"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "dnf install -y fuse-devel",
    "curl -fsSLo /tmp/vfspy-go.tar.gz https://go.dev/dl/go1.27.4.linux-amd64.tar.gz",
    "tar -xzf /tmp/vfspy-go.tar.gz -C /usr/local",
]
environment = { PATH = "/usr/local/go/bin:$PATH", CGO_ENABLED = "1" }

[tool.cibuildwheel.windows]
# A standalone Go executable has no Python extension DLLs to repair.
repair-wheel-command = ""

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/vfspy/_rpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
